name: Send Daily AI News Email

on:
  push:
    branches: [master]
    paths:
      - 'docs/**/*.md'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os, glob
          from datetime import date

          # Find files changed in this push
          diff = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'],
                                capture_output=True, text=True).stdout.strip().split('\n')
          ai_files = [f for f in diff if f.startswith('docs/') and 'AI_Daily_' in f and f.endswith('.md')]

          # Fallback: today's files
          if not ai_files:
              today = date.today().strftime('%d_%m_%Y')
              ai_files = glob.glob(f'docs/*/AI_Daily_{today}.md')

          api_key = os.environ['RESEND_API_KEY']
          EMAIL_MAP = {
                  "yuval": "yuvalelazary@gmail.com",
                  "yuval2": "Ywbl8057@gmail.com",
              }
          for filepath in ai_files:
              user_name = filepath.split('/')[1]
              user_email = EMAIL_MAP.get(user_name)
              if not user_email:
                  print(f'No email mapping for: {user_name}, skipping')
                  continue

              content = open(filepath, encoding='utf-8').read()
              date_part = os.path.basename(filepath).replace('AI_Daily_', '').replace('.md', '').replace('_', '/')

              html_body = ("<html><head><meta charset='utf-8'></head>"
                           "<body dir='rtl' style='font-family:Arial,sans-serif;direction:rtl;"
                           "text-align:right;line-height:1.8;max-width:800px;margin:auto;padding:20px;'>"
                           "<pre style='white-space:pre-wrap;font-family:Arial,sans-serif;'>"
                           + content + "</pre></body></html>")

              payload = {
                  'from': 'onboarding@resend.dev',
                  'to': user_email,
                  'subject': 'עדכון AI יומי — ' + date_part,
                  'html': html_body
              }

              with open('/tmp/email.json', 'w', encoding='utf-8') as f:
                  json.dump(payload, f, ensure_ascii=False)

              result = subprocess.run([
                  'curl', '-s', '-X', 'POST', 'https://api.resend.com/emails',
                  '-H', f'Authorization: Bearer {api_key}',
                  '-H', 'Content-Type: application/json',
                  '--data-binary', '@/tmp/email.json'
              ], capture_output=True, text=True)

              print(f'Sent to {user_email}: {result.stdout}')
          PYEOF
